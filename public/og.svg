<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C0C0F"/>
      <stop offset="1" stop-color="#101014"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.9">
      <stop offset="0" stop-color="#2DD4A0" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#2DD4A0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4A0"/>
      <stop offset="1" stop-color="#14B08A"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- header row -->
  <g transform="translate(80,84)">
    <path d="M14 0 L28 14 L14 28 L0 14 Z" fill="url(#accent)"/>
    <text x="42" y="22" font-family="Inter, Arial, sans-serif" font-size="26" font-weight="700" fill="#F4F4F5" letter-spacing="0.5">NEXUS</text>
    <text x="150" y="22" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6B6B76">Intelligence Terminal</text>
  </g>

  <!-- headline -->
  <text x="80" y="230" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#F4F4F5" letter-spacing="-2">Market intelligence,</text>
  <text x="80" y="310" font-family="Inter, Arial, sans-serif" font-size="64" font-weight="800" fill="#2DD4A0" letter-spacing="-2">Bloomberg-grade. Free.</text>
  <text x="80" y="372" font-family="Inter, Arial, sans-serif" font-size="24" fill="#A1A1AA">IDX bandarmology · fundamentals · 14 global markets · on-chain · AI signals</text>

  <!-- stats row -->
  <g font-family="Inter, Arial, sans-serif" transform="translate(80,470)">
    <g>
      <text x="0"   y="0"  font-size="34" font-weight="700" fill="#F4F4F5">38,902</text>
      <text x="0"   y="30" font-size="15" fill="#6B6B76">instruments</text>
    </g>
    <g transform="translate(240,0)">
      <text x="0" y="0"  font-size="34" font-weight="700" fill="#F4F4F5">20</text>
      <text x="0" y="30" font-size="15" fill="#6B6B76">exchanges</text>
    </g>
    <g transform="translate(400,0)">
      <text x="0" y="0"  font-size="34" font-weight="700" fill="#F4F4F5">15</text>
      <text x="0" y="30" font-size="15" fill="#6B6B76">markets</text>
    </g>
    <g transform="translate(540,0)">
      <text x="0" y="0"  font-size="34" font-weight="700" fill="#F4F4F5">58+</text>
      <text x="0" y="30" font-size="15" fill="#6B6B76">data modules</text>
    </g>
    <g transform="translate(740,0)">
      <text x="0" y="0"  font-size="34" font-weight="700" fill="#2DD4A0">Free</text>
      <text x="0" y="30" font-size="15" fill="#6B6B76">forever</text>
    </g>
  </g>

  <!-- bottom rule -->
  <rect x="80" y="560" width="1040" height="2" fill="#232329"/>
  <text x="80" y="596" font-family="Inter, Arial, sans-serif" font-size="15" fill="#6B6B76">tracker.aitradepulse.com</text>
</svg>
