services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      POSTGRES_DB: nexus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus"]
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - db_password

  redis:
    image: redis:7-alpine
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$(cat /run/secrets/redis_password)\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "test \"$$(redis-cli --no-auth-warning -a \"$$(cat /run/secrets/redis_password)\" ping)\" = PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - redis_password

  clickhouse:
    image: clickhouse/clickhouse-server:24.9
    environment:
      CLICKHOUSE_PASSWORD_FILE: /run/secrets/clickhouse_password
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ./db/clickhouse-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    secrets:
      - clickhouse_password

  db-init:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["sh", "-c", "export DATABASE_URL=\"postgresql://nexus:$$(cat /run/secrets/db_password)@postgres:5432/nexus\"; exec npx prisma migrate deploy"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - db_password

  web:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["sh", "-c", "export DATABASE_URL=\"postgresql://nexus:$$(cat /run/secrets/db_password)@postgres:5432/nexus\" REDIS_URL=\"redis://:$$(cat /run/secrets/redis_password)@redis:6379\"; exec node server.js"]
    env_file:
      - .env
    ports:
      - "4400:4400"
    environment:
      - USE_BATCH_INDEXER=1
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    secrets:
      - db_password
      - redis_password

  ws:
    build:
      context: ./ws-server
    command: ["sh", "-c", "export REDIS_URL=\"redis://:$$(cat /run/secrets/redis_password)@redis:6379\"; exec npm start"]
    env_file:
      - .env
    ports:
      - "4401:4401"
    environment:
      - WS_PORT=4401
    depends_on:
      redis:
        condition: service_healthy
    secrets:
      - redis_password

  indexer:
    build:
      context: ./indexer
    command: ["sh", "-c", "export DATABASE_URL=\"postgresql://nexus:$$(cat /run/secrets/db_password)@postgres:5432/nexus\" REDIS_URL=\"redis://:$$(cat /run/secrets/redis_password)@redis:6379\" CLICKHOUSE_PASSWORD=\"$$(cat /run/secrets/clickhouse_password)\"; exec npm start"]
    env_file:
      - .env
    environment:
      - CLICKHOUSE_URL=http://clickhouse:8123
      - CLICKHOUSE_USER=default
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - HEALTH_PORT=4409
      - USE_BATCH_INDEXER=1
    depends_on:
      db-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    restart: unless-stopped
    secrets:
      - db_password
      - redis_password
      - clickhouse_password

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    env_file:
      - .env
    ports:
      - "4402:4402"
    environment:
      - MCP_PORT=4402
      - NEXUS_API_URL=http://web:4400
    depends_on:
      web:
        condition: service_started
    restart: unless-stopped

  re-verifier:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: ["sh", "-c", "export DATABASE_URL=\"postgresql://nexus:$$(cat /run/secrets/db_password)@postgres:5432/nexus\" REDIS_URL=\"redis://:$$(cat /run/secrets/redis_password)@redis:6379\"; exec npx tsx scripts/verify-re-modules.ts"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    secrets:
      - db_password
      - redis_password

volumes:
  postgres_data:
  redis_data:
  clickhouse_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
  redis_password:
    file: ./secrets/redis_password.txt
  clickhouse_password:
    file: ./secrets/clickhouse_password.txt
